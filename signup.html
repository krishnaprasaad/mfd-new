<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->

        gtag('js', new Date());

        gtag('config', 'G-9GQN2TGBJC');

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Started — Live Wealth</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='10' fill='%230f172a'/><ellipse cx='18' cy='28' rx='9' ry='3.5' fill='%2310b981' opacity='0.7'/><line x1='18' y1='27' x2='18' y2='13' stroke='%2310b981' stroke-width='2' stroke-linecap='round'/><path d='M18 18 Q12 14 13 8 Q17 10 18 16' fill='%2310b981' opacity='0.85'/><path d='M18 15 Q24 11 23 5 Q19 7 18 13' fill='%2310b981'/></svg>">
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        .signup-page {
            min-height: 100vh;
            background: var(--colorBackground);
            display: flex;
            flex-direction: column;
        }

        .signup-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .signup-card {
            width: 100%;
            max-width: 500px;
            background: var(--colorSurface);
            border: 1px solid var(--colorBorder);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .signup-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--colorPrimary), var(--colorAccent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .signup-header p {
            color: var(--colorTextMuted);
            font-size: 0.95rem;
        }

        .form-success-container {
            text-align: center;
            padding: 2rem 0;
            display: none;
        }

        .form-success-container.active {
            display: block;
        }

        .success-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        /* --- Multi-step styles --- */
        .step-section {
            display: none;
        }

        .step-section.active {
            display: block;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--colorBorder);
            transition: background 0.3s;
        }

        .dot.active {
            background: var(--colorAccent);
            width: 24px;
            border-radius: 4px;
        }

        .step-btns {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
    </style>
</head>

<body class="signup-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <svg class="logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="36" height="36" rx="10" fill="#0f172a" />
                    <ellipse cx="18" cy="28" rx="9" ry="3.5" fill="#10b981" opacity="0.4" />
                    <ellipse cx="18" cy="27" rx="9" ry="3.5" fill="#10b981" opacity="0.7" />
                    <line x1="18" y1="27" x2="18" y2="13" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
                    <path d="M18 18 Q12 14 13 8 Q17 10 18 16" fill="#10b981" opacity="0.85" />
                    <path d="M18 15 Q24 11 23 5 Q19 7 18 13" fill="#10b981" />
                </svg>
                Live Wealth
            </a>
            <div class="nav-links">
                <a href="/" class="btn btn-secondary" style="text-decoration:none;">← Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="signup-container">
        <div class="signup-card">
            <div id="signup-form-content">
                <div class="signup-header">
                    <h1>Start Your Journey</h1>
                    <p id="step-helper-text">Step 1 of 2: Basic Information</p>
                </div>

                <div class="step-indicator">
                    <div class="dot active" id="dot-1"></div>
                    <div class="dot" id="dot-2"></div>
                </div>

                <form id="signup-page-form">
                    <!-- Step 1: Personal Details -->
                    <div class="step-section active" id="step-1">
                        <div class="form-group">
                            <label for="reg-name">Full Name</label>
                            <input type="text" id="reg-name" required placeholder="As per PAN card">
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email Address</label>
                            <input type="email" id="reg-email" required placeholder="you@example.com">
                        </div>
                        <div class="form-group">
                            <label for="reg-phone">Mobile Number</label>
                            <input type="tel" id="reg-phone" required placeholder="+91 98765 43210" maxlength="15">
                        </div>
                        <div class="step-btns">
                            <button type="button" class="btn btn-primary full-width" id="next-step-btn">
                                Next Step →
                            </button>
                        </div>
                    </div>

                    <!-- Step 2: KYC Details -->
                    <div class="step-section" id="step-2">
                        <div class="form-group">
                            <label for="reg-pan">PAN Card Number</label>
                            <input type="text" id="reg-pan" required placeholder="ABCDE1234F"
                                style="text-transform: uppercase;" maxlength="10">
                        </div>
                        <div class="form-group">
                            <label for="reg-dob">Date of Birth</label>
                            <input type="date" id="reg-dob" required>
                        </div>
                        <div class="step-btns">
                            <button type="button" class="btn btn-secondary" id="prev-step-btn" style="flex: 1;">
                                ← Back
                            </button>
                            <button type="submit" class="btn btn-primary" id="reg-submit-btn" style="flex: 2;">
                                Create Account
                            </button>
                        </div>
                    </div>

                    <div class="form-error" id="reg-error"></div>

                    <p style="text-align:center; font-size:0.85rem; color:var(--colorTextMuted); margin-top:1.5rem;">
                        Already have an account? <a href="/?login=true" style="color:var(--colorAccent); text-decoration:none; font-weight:600;">Log in</a>
                    </p>
                </form>
            </div>

            <div id="signup-success-view" class="form-success-container">
                <div class="success-icon">🎉</div>
                <h2 style="font-family:'Outfit',sans-serif; margin-bottom:1rem;">Application Received!</h2>
                <p style="color:var(--colorTextMuted); line-height:1.6; margin-bottom:2rem;">
                    Thank you for choosing Live Wealth. Our team will verify your details and send your login credentials to your email within 1-2 working days.
                </p>
                <a href="/" class="btn btn-primary">Return to Home</a>
            </div>
        </div>
    </div>

    <script type="module" src="./signup.js"></script>
</body>

</html>
