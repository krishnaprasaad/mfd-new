<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Live Investments</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-login-body">
    <div class="admin-login-card">
        <div style="margin-bottom: 2rem;">
            <svg style="width: 48px; height: 48px; margin: 0 auto 1rem;" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="36" height="36" rx="10" fill="#0f172a" />
                <ellipse cx="18" cy="28" rx="9" ry="3.5" fill="#10b981" opacity="0.4" />
                <ellipse cx="18" cy="27" rx="9" ry="3.5" fill="#10b981" opacity="0.7" />
                <line x1="18" y1="27" x2="18" y2="13" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
                <path d="M18 18 Q12 14 13 8 Q17 10 18 16" fill="#10b981" opacity="0.85" />
                <path d="M18 15 Q24 11 23 5 Q19 7 18 13" fill="#10b981" />
            </svg>
            <h1 style="font-family: var(--fontOutfit); font-size: 1.5rem; color: var(--colorPrimary);">Admin Portal</h1>
            <p style="color: var(--colorTextMuted); font-size: 0.9rem;">Secure access for authorized personnel only.</p>
        </div>

        <form id="admin-login-form">
            <div class="form-group-standard" style="text-align: left;">
                <label class="label-standard" for="username">Username</label>
                <input class="input-standard" type="text" id="username" name="username" required placeholder="Enter admin username">
            </div>
            <div class="form-group-standard" style="text-align: left;">
                <label class="label-standard" for="password">Password</label>
                <input class="input-standard" type="password" id="password" name="password" required placeholder="Enter admin password">
            </div>
            
            <div id="login-error" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; min-height: 1.2rem;"></div>
            
            <button type="submit" class="btn-standard" id="login-btn">Secure Login</button>
        </form>
        
        <div style="margin-top: 2rem;">
            <a href="/" style="color: var(--colorTextMuted); text-decoration: none; font-size: 0.85rem;">← Back to Website</a>
        </div>
    </div>

    <script type="module" src="./admin.js"></script>
</body>
</html>
